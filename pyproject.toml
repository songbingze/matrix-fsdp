[build-system]
requires = [
    "setuptools>=68",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "matrix-fsdp"
version = "0.1.0"
description = "An FSDP2-like runtime for MatrixShard layouts"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "MatrixFSDP contributors"},
]
keywords = [
    "pytorch",
    "fsdp",
    "distributed-training",
    "matrix-sharding",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.10",
    "numpy<2.0.0",
]

[project.optional-dependencies]
test = [
    "expecttest",
    "hypothesis",
    "pytest",
]
dev = [
    "expecttest",
    "hypothesis",
    "pytest",
]

[project.urls]
Homepage = "https://github.com/findlamp/matrix-fsdp"
Repository = "https://github.com/findlamp/matrix-fsdp"

[tool.setuptools.packages.find]
include = ["matrix_fsdp", "matrix_fsdp.*"]

[tool.setuptools.package-data]
matrix_fsdp = [
    "kernels/native/*.cpp",
    "kernels/native/*.cu",
    "kernels/native/*.md",
    "kernels/gin/native/*.cpp",
    "kernels/gin/native/*.md",
]


[tool.black]
line-length = 120
target-version = ["py38", "py39", "py310", "py311"]


[tool.ruff]
target-version = "py39"

# NOTE: Synchoronize the ignores with .flake8
lint.ignore = [
    # these ignores are from flake8-bugbear; please fix!
    "B007", "B008", "B017",
    "B018", # Useless expression
    "B019", "B020",
    "B023", "B024", "B026",
    "B028", # No explicit `stacklevel` keyword argument found
    "B904",
    "E402",
    "C408", # C408 ignored because we like the dict keyword argument syntax
    "E501", # E501 is not flexible enough, we're using B950 instead
    "E721",
    "E731", # Assign lambda expression
    "E741",
    "EXE001",
    "F405",
    "F821",
    "F841",
    # these ignores are from flake8-logging-format; please fix!
    "G101", "G201", "G202",
    # these ignores are from RUFF perf; please fix!
    "PERF203", "PERF4",
    "SIM102", "SIM103", "SIM112", # flake8-simplify code styles
    "SIM105", # these ignores are from flake8-simplify. please fix or ignore with commented reason
    "SIM108",
    "SIM110",
    "SIM114", # Combine `if` branches using logical `or` operator
    "SIM115",
    "SIM116", # Disable Use a dictionary instead of consecutive `if` statements
    "SIM117",
    "SIM118",
    "UP006", # keep-runtime-typing
    "UP007", # keep-runtime-typing
    "UP035",
]
line-length = 120
lint.select = [
    "B",
    "C4",
    "G",
    "E",
    "F",
    "SIM1",
    "W",
    # Not included in flake8
    "UP",
    "PERF",
    "PGH004",
    "PIE807",
    "PIE810",
    "PLE",
    "TRY302",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
